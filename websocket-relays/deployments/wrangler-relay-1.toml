name = "ownly-websocket-relay-1"
main = "websocket-handler.js"
compatibility_date = "2024-07-01"

# Durable Objects configuration
[[durable_objects.bindings]]
name = "RELAY_DURABLE_OBJECT"
class_name = "RelayDurableObject"

# Durable Objects migrations (SQLite for free plan)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDurableObject"]

# WebSocket Relay #1 - Primary Server
[env.production]
name = "ownly-websocket-relay-1-prod"

[env.staging]
name = "ownly-websocket-relay-1-staging"